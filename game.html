<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Word Game - Play</title>
  </head>
  <body>
    <h1 id="title">ゲーム画面</h1>
    <p id="category-name">カテゴリを読み込み中...</p>

    <script>
      const token = localStorage.getItem("github_token");

      if (!token) {
        alert("トークンが設定されていません。\ntoken.html で設定してください。");
      }

      const owner = "maccccchon-collab";   // ← あなたの GitHub ID（c の数はここで統一）
      const repo  = "wordgame-assets";

      // URL から category を取得
      const params = new URLSearchParams(window.location.search);
      const category = params.get("category");

      if (category) {
        document.getElementById("category-name").textContent =
          "選んだカテゴリ：" + category;
      }

      // materials.json を取得
      async function loadMaterials() {
        const url = `https://api.github.com/repos/${owner}/${repo}/contents/materials.json`;

        const response = await fetch(url, {
          headers: { Authorization: `token ${token}` }
        });

        if (!response.ok) {
          console.error("materials.json を取得できません:", response.status);
          return null;
        }

        const data = await response.json();
        const jsonText = atob(data.content);
        return JSON.parse(jsonText);
      }

      // git/blobs API で確実に base64 を取得
      async function fetchImageBase64(path) {
        const contentsUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

        const contentsRes = await fetch(contentsUrl, {
          headers: { Authorization: `token ${token}` }
        });

        if (!contentsRes.ok) {
          console.error("contents 取得失敗:", path, contentsRes.status);
          return null;
        }

        const contentsData = await contentsRes.json();

        if (!contentsData.sha) {
          console.error("sha が取得できません:", contentsData);
          return null;
        }

        const blobUrl = `https://api.github.com/repos/${owner}/${repo}/git/blobs/${contentsData.sha}`;

        const blobRes = await fetch(blobUrl, {
          headers: { Authorization: `token ${token}` }
        });

        if (!blobRes.ok) {
          console.error("blob 取得失敗:", path, blobRes.status);
          return null;
        }

        const blobData = await blobRes.json();

        return "data:image/*;base64," + blobData.content;
      }

      async function startGame() {
        const materials = await loadMaterials();
        if (!materials) return;

        // ★ tags に category が含まれるものだけ抽出
        const filtered = materials.filter(item =>
          item.tags && item.tags.includes(category)
        );

        console.log("カテゴリに一致したデータ:", filtered);

        if (filtered.length === 0) {
          document.body.insertAdjacentHTML("beforeend",
            "<p>このカテゴリの画像はありません。</p>");
          return;
        }

        // とりあえず最初の1枚を表示
        const first = filtered[0];

        const imgBase64 = await fetchImageBase64(first.image);

        if (imgBase64) {
          const img = document.createElement("img");
          img.src = imgBase64;
          img.style.width = "200px";
          document.body.appendChild(img);
        } else {
          document.body.insertAdjacentHTML("beforeend",
            "<p>画像を読み込めませんでした。</p>");
        }
      }

      startGame();
    </script>
  </body>
</html>
