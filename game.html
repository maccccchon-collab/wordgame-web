<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Word Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      background: #f7f7f7;
    }

    #title {
      font-size: 28px;
      margin: 20px 0 10px;
    }

    #category-name {
      font-size: 20px;
      margin-bottom: 20px;
    }

    #game-area {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #choices {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      width: 90%;
      max-width: 700px;
      margin: 0 auto;
    }

    .choice-img {
      width: 100%;
      border-radius: 12px;
      background: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.1s;
    }

    .choice-img:active {
      transform: scale(0.95);
    }

    #progress {
      margin-top: 20px;
      font-size: 22px;
    }

    #sound-btn {
      position: fixed;
      top: 10px;
      right: 10px;
      font-size: 28px;
      padding: 10px 18px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      cursor: pointer;
    }

    /* 結果画面 */
    #result-area img {
      width: 150px;
      margin: 10px;
      border-radius: 10px;
      background: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .result-btn {
      font-size: 22px;
      padding: 12px 20px;
      margin: 10px;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="sound-btn">♪</div>

  <h1 id="title">Word Game</h1>
  <p id="category-name">Loading...</p>

  <div id="game-area">
    <div id="choices"></div>
    <div id="progress"></div>
  </div>

  <div id="result-area" style="display:none;"></div>

<script>
  const token = localStorage.getItem("github_token");
  const owner = "maccccchon-collab";  // ← あなたの GitHub ID
  const repo  = "wordgame-assets";

  const params = new URLSearchParams(window.location.search);
  const category = params.get("category");

  document.getElementById("category-name").textContent = "Category: " + category;

  let materials = [];
  let gameData = [];
  let current = 0;
  let wrongList = [];

  // -------------------------
  // GitHub API: materials.json 読み込み
  // -------------------------
  async function loadMaterials() {
    const url = `https://api.github.com/repos/${owner}/${repo}/contents/materials.json`;

    const res = await fetch(url, {
      headers: { Authorization: `token ${token}` }
    });

    const data = await res.json();
    return JSON.parse(atob(data.content));
  }

  // -------------------------
  // GitHub API: 画像・音声を base64 で取得
  // -------------------------
  async function fetchBlobBase64(path) {
    const contentsUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

    const contentsRes = await fetch(contentsUrl, {
      headers: { Authorization: `token ${token}` }
    });

    const contentsData = await contentsRes.json();
    const blobUrl = `https://api.github.com/repos/${owner}/${repo}/git/blobs/${contentsData.sha}`;

    const blobRes = await fetch(blobUrl, {
      headers: { Authorization: `token ${token}` }
    });

    const blobData = await blobRes.json();
    return "data:;base64," + blobData.content;
  }

  // -------------------------
  // シャッフル
  // -------------------------
  function shuffle(arr) {
    return arr.sort(() => Math.random() - 0.5);
  }

  // -------------------------
  // ゲーム開始
  // -------------------------
  async function startGame() {
    materials = await loadMaterials();

    const filtered = materials.filter(m =>
      m.tags && m.tags.includes(category)
    );

    if (filtered.length < 10) {
      alert("This category has less than 10 items.");
      return;
    }

    gameData = shuffle(filtered).slice(0, 10);
    current = 0;
    wrongList = [];

    showQuestion();
  }

  // -------------------------
  // 問題表示
  // -------------------------
  async function showQuestion() {
    if (current >= 10) {
      showResult();
      return;
    }

    const q = gameData[current];

    // 音声再生
    const soundBase64 = await fetchBlobBase64(q.sound);
    const audio = new Audio(soundBase64);
    audio.play();

    document.getElementById("sound-btn").onclick = () => audio.play();

    // 選択肢
    const choicesArea = document.getElementById("choices");
    choicesArea.innerHTML = "";

    let choices = shuffle(gameData).slice(0, 4);
    if (!choices.includes(q)) choices[0] = q;
    choices = shuffle(choices);

    for (const c of choices) {
      const imgBase64 = await fetchBlobBase64(c.image);

      const img = document.createElement("img");
      img.src = imgBase64;
      img.className = "choice-img";

      img.onclick = () => checkAnswer(c);

      choicesArea.appendChild(img);
    }

    document.getElementById("progress").textContent =
      `${current + 1} / 10`;
  }

  // -------------------------
  // 答えチェック
  // -------------------------
  async function checkAnswer(selected) {
    const q = gameData[current];

    let soundPath = "";
    if (selected.id === q.id) {
      soundPath = "sounds/pinpon.mp3";
    } else {
      soundPath = "sounds/buzzer.mp3";
      wrongList.push(q);
    }

    const s = await fetchBlobBase64(soundPath);
    new Audio(s).play();

    current++;
    setTimeout(showQuestion, 800);
  }

  // -------------------------
  // 結果画面
  // -------------------------
  async function showResult() {
    document.getElementById("game-area").style.display = "none";

    const result = document.getElementById("result-area");
    result.style.display = "block";

    result.innerHTML = `<h2>Result: ${10 - wrongList.length} / 10</h2>`;

    for (const w of wrongList) {
      const imgBase64 = await fetchBlobBase64(w.image);
      result.innerHTML += `<img src="${imgBase64}">`;
    }

    result.innerHTML += `
      <div>
        <button class="result-btn" onclick="startGame()">Try Again</button>
        <button class="result-btn" onclick="location.href='index.html'">Back</button>
      </div>
    `;
  }

  startGame();
</script>

</body>
