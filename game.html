<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Word Game - Play</title>
  </head>
  <body>
    <h1 id="title">ゲーム画面</h1>
    <p id="category-name">カテゴリを読み込み中...</p>

    <script>
      const token = localStorage.getItem("github_token");

      if (!token) {
        alert("トークンが設定されていません。\ntoken.html で設定してください。");
      }

      const owner = "maccccchon-collab";   // ← ここを自分のIDに合わせてね
      const repo  = "wordgame-assets";

      // 1) contents API でファイル情報を取得（sha を取る）
      // 2) git/blobs API で base64 を取得（サイズ制限を回避）
      async function fetchImageBase64(path) {
        const contentsUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

        const contentsRes = await fetch(contentsUrl, {
          headers: {
            Authorization: `token ${token}`
          }
        });

        if (!contentsRes.ok) {
          console.error("contents 取得失敗:", path, contentsRes.status);
          return null;
        }

        const contentsData = await contentsRes.json();

        if (!contentsData.sha) {
          console.error("sha が取得できませんでした:", contentsData);
          return null;
        }

        const blobUrl = `https://api.github.com/repos/${owner}/${repo}/git/blobs/${contentsData.sha}`;

        const blobRes = await fetch(blobUrl, {
          headers: {
            Authorization: `token ${token}`
          }
        });

        if (!blobRes.ok) {
          console.error("blob 取得失敗:", path, blobRes.status);
          return null;
        }

        const blobData = await blobRes.json();

        if (!blobData.content) {
          console.error("blob の content が空です:", blobData);
          return null;
        }

        // git/blobs は必ず base64 を返す
        return "data:image/*;base64," + blobData.content;
      }

      async function startGame() {
        const path = "images/1.jpg";

        const imgBase64 = await fetchImageBase64(path);

        console.log("1.jpg の取得結果:", imgBase64 ? "成功" : "失敗");

        if (imgBase64) {
          const img = document.createElement("img");
          img.src = imgBase64;
          img.style.width = "200px";
          document.body.appendChild(img);
        } else {
          const p = document.createElement("p");
          p.textContent = "1.jpg を読み込めませんでした（404 or API エラーの可能性）";
          document.body.appendChild(p);
        }
      }

      startGame();
    </script>
  </body>
</html>
