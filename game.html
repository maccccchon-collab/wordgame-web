<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Word Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      background: #f7f7f7;
    }

    #title {
      font-size: 28px;
      margin: 20px 0 10px;
    }

    #category-name {
      font-size: 20px;
      margin-bottom: 20px;
    }

    #game-area {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #choices {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      width: 90%;
      max-width: 700px;
      margin: 0 auto;
    }

    .choice-img {
      width: 100%;
      border-radius: 12px;
      background: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.1s;
    }

    .choice-img:active {
      transform: scale(0.95);
    }

    #progress {
      margin-top: 20px;
      font-size: 22px;
    }

    #sound-btn {
      position: fixed;
      top: 10px;
      right: 10px;
      font-size: 28px;
      padding: 10px 18px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      cursor: pointer;
    }

    #result-area img {
      width: 150px;
      margin: 10px;
      border-radius: 10px;
      background: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .result-btn {
      font-size: 22px;
      padding: 12px 20px;
      margin: 10px;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="sound-btn">♪</div>

  <h1 id="title">Word Game</h1>
  <p id="category-name">Loading...</p>

  <div id="game-area">
    <div id="choices"></div>
    <div id="progress"></div>
  </div>

  <div id="result-area" style="display:none;"></div>

<script>
  const token = localStorage.getItem("github_token");
  const owner = "maccccchon-collab";
  const repo  = "wordgame-assets";

  const params = new URLSearchParams(window.location.search);
  const category = params.get("category");

  document.getElementById("category-name").textContent = "Category: " + category;

  let materials = [];
  let gameData = [];
  let current = 0;
  let wrongList = [];

  let currentAudio = null;
  let isLocked = false;

  let pinponData = null;
  let buzzerData = null;

  // -------------------------
  // /contents/ API で base64 を取得
  // -------------------------
  async function fetchBase64(path) {
    const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

    const res = await fetch(url, {
      headers: { Authorization: `token ${token}` }
    });

    if (!res.ok) {
      console.error("取得失敗:", path, res.status);
      return null;
    }

    const data = await res.json();
    if (!data.content) return null;

    let mime = "";
    if (path.endsWith(".jpg") || path.endsWith(".jpeg")) mime = "image/jpeg";
    else if (path.endsWith(".png")) mime = "image/png";
    else if (path.endsWith(".mp3")) mime = "audio/mpeg";

    return `data:${mime};base64,${data.content}`;
  }

  // -------------------------
  // materials.json 読み込み
  // -------------------------
  async function loadMaterials() {
    const url = `https://api.github.com/repos/${owner}/${repo}/contents/materials.json`;

    const res = await fetch(url, {
      headers: { Authorization: `token ${token}` }
    });

    const data = await res.json();
    return JSON.parse(atob(data.content));
  }

  // -------------------------
  // シャッフル
  // -------------------------
  function shuffle(arr) {
    return arr.sort(() => Math.random() - 0.5);
  }

  // -------------------------
  // 選択肢（正解1＋不正解3）
  // -------------------------
  function makeChoices(q) {
    const others = gameData.filter(item => item.id !== q.id);
    const wrongs = shuffle(others).slice(0, 3);
    return shuffle([q, ...wrongs]);
  }

  // -------------------------
  // ゲーム開始（プリロード付き）
  // -------------------------
  async function startGame() {
    materials = await loadMaterials();

    const filtered = materials.filter(m =>
      m.tags && m.tags.includes(category)
    );

    if (filtered.length < 10) {
      alert("This category has less than 10 items.");
      return;
    }

    gameData = shuffle(filtered).slice(0, 10);
    current = 0;
    wrongList = [];

    // ★ 10問分の画像と音声をプリロード
    for (const item of gameData) {
      item.imageData = await fetchBase64(item.image);
      item.soundData = await fetchBase64(item.sound);
    }

    // ★ 正解・不正解音もプリロード
    pinponData = await fetchBase64("sounds/pinpon.mp3");
    buzzerData = await fetchBase64("sounds/buzzer.mp3");

    showQuestion();
  }

  // -------------------------
  // 問題表示（音声ロック＋停止付き）
  // -------------------------
  function showQuestion() {
    if (current >= 10) {
      showResult();
      return;
    }

    isLocked = false;

    const q = gameData[current];

    // 前の音声を止める
    if (currentAudio) {
      currentAudio.pause();
      currentAudio = null;
    }

    // プリロード済み音声を再生
    currentAudio = new Audio(q.soundData);
    currentAudio.play();

    document.getElementById("sound-btn").onclick = () => {
      if (currentAudio) {
        currentAudio.currentTime = 0;
        currentAudio.play();
      }
    };

    // 選択肢表示
    const choicesArea = document.getElementById("choices");
    choicesArea.innerHTML = "";

    const choices = makeChoices(q);

    for (const c of choices) {
      const img = document.createElement("img");
      img.src = c.imageData;
      img.className = "choice-img";

      img.onclick = () => checkAnswer(c);

      choicesArea.appendChild(img);
    }

    document.getElementById("progress").textContent =
      `${current + 1} / 10`;
  }

  // -------------------------
  // 答えチェック（音声ロック＋停止）
  // -------------------------
  function checkAnswer(selected) {
    if (isLocked) return;
    isLocked = true;

    const q = gameData[current];

    // 問題音声を止める
    if (currentAudio) {
      currentAudio.pause();
      currentAudio = null;
    }

    let feedbackAudio;

    if (selected.id === q.id) {
      feedbackAudio = new Audio(pinponData);
    } else {
      feedbackAudio = new Audio(buzzerData);
      wrongList.push(q);
    }

    feedbackAudio.play();

    feedbackAudio.onended = () => {
      current++;
      showQuestion();
    };
  }

  // -------------------------
  // 結果画面
  // -------------------------
  function showResult() {
    document.getElementById("game-area").style.display = "none";

    const result = document.getElementById("result-area");
    result.style.display = "block";

    result.innerHTML = `<h2>Result: ${10 - wrongList.length} / 10</h2>`;

    for (const w of wrongList) {
      result.innerHTML += `<img src="${w.imageData}">`;
    }

    result.innerHTML += `
      <div>
        <button class="result-btn" onclick="startGame()">Try Again</button>
        <button class="result-btn" onclick="location.href='index.html'">Back</button>
      </div>
    `;
  }

  startGame();
</script>

</body>
</html>
