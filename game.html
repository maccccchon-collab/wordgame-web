<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Word Game - Play</title>
  </head>
  <body>
    <h1 id="title">ゲーム画面</h1>
    <p id="category-name">カテゴリを読み込み中...</p>

    <script>
      // iPad に保存されたトークンを取得
      const token = localStorage.getItem("github_token");

      if (!token) {
        alert("トークンが設定されていません。\ntoken.html で設定してください。");
      }
      
      // URL から category=◯◯ を取得
      const params = new URLSearchParams(window.location.search);
      const category = params.get("category");

      // カテゴリ名を画面に表示
      if (category) {
        document.getElementById("category-name").textContent =
          "選んだカテゴリ：" + category;
      } else {
        document.getElementById("category-name").textContent =
          "カテゴリが見つかりませんでした";
      }

      async function loadMaterials() {
        const url = "https://api.github.com/repos/maccccchon-collab/wordgame-assets/contents/materials.json";

        const response = await fetch(url, {
          headers: {
            Authorization: `token ${token}`
          }
        });

        if (!response.ok) {
          console.error("materials.json を取得できませんでした:", response.status);
          return null;
        }

        const data = await response.json();

        // GitHub API は base64 で返すのでデコードする
        const jsonText = atob(data.content);
        return JSON.parse(jsonText);
      }

      async function fetchImageBase64(path) {
        const url = `https://api.github.com/repos/maccccchon-collab/wordgame-assets/contents/${path}`;

        const response = await fetch(url, {
          headers: {
            Authorization: `token ${token}`
          }
        });

        if (!response.ok) {
          console.error("画像を取得できませんでした:", path, response.status);
          return null;
        }

        const data = await response.json();
        return "data:image/*;base64," + data.content;
      }

      async function startGame() {
        const materials = await loadMaterials();
        if (!materials) return;

        const items = materials.filter(item => item.category === category);

        console.log("選んだカテゴリのデータ:", items);

        // まず1つ目の画像を表示してみる
        if (items.length > 0) {
          const imgBase64 = await fetchImageBase64(items[0].image);

          if (imgBase64) {
            const img = document.createElement("img");
            img.src = imgBase64;
            img.style.width = "200px";
            document.body.appendChild(img);
          }
        }
      }

      startGame();
      
    </script>
  </body>
</html>
