<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Word Game - Play</title>
  </head>
  <body>
    <h1 id="title">ゲーム画面</h1>
    <p id="category-name">カテゴリを読み込み中...</p>

    <script>
      // URL から category=◯◯ を取得
      const params = new URLSearchParams(window.location.search);
      const category = params.get("category");

      // カテゴリ名を画面に表示
      if (category) {
        document.getElementById("category-name").textContent =
          "選んだカテゴリ：" + category;
      } else {
        document.getElementById("category-name").textContent =
          "カテゴリが見つかりませんでした";
      }
    </script>
  </body>
</html>
